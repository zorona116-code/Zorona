name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Repository hygiene
        run: node scripts/verify-repository-hygiene.mjs

      - name: Verify syntax
        run: npm run verify:syntax

      - name: Run unit tests
        run: npm test

      - name: Build workspaces
        run: npm run build

      - name: Smoke test (menu, offer, reservations, admin)
        run: npm run smoke
        env:
          CI_ADMIN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
