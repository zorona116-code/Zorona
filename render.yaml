# Render Blueprint for the ZORONA web/API, admin dashboard and durable PostgreSQL.
# Secret values are intentionally not committed; Render will prompt for sync:false fields.
databases:
  - name: zorona-production-db
    databaseName: zorona
    user: zorona
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: zorona-web
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zorona-production-db
          property: connectionString
      - key: DATABASE_SSL
        value: strict
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: ARABISK_CORS_ORIGINS
        fromService:
          name: zorona-admin
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: AWS_ENDPOINT_URL
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_S3_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: zorona-admin
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./apps/admin/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ARABISK_ADMIN_USERNAME
        sync: false
      - key: ARABISK_ADMIN_PASSWORD
        sync: false
      - key: ARABISK_ADMIN_API_KEY
        generateValue: true
      - key: ARABISK_ADMIN_SESSION_SECRET
        generateValue: true
      - key: ARABISK_WEB_API_URL
        fromService:
          name: zorona-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ARABISK_WEB_API_PRIVATE_DOMAIN
        value: zorona-web
      - key: ARABISK_WEB_API_PRIVATE_PORT
        value: "10000"
